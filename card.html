<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MaKarma 個人名片</title>
    <style>
        :root { --primary-color: #F39800; --background-color: #f9f9f9; --text-color: #333; --form-bg-color: #ffffff; --border-color: #e0e0e0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; background-color: var(--background-color); color: var(--text-color); }
        .container { width: 100%; max-width: 500px; background-color: var(--form-bg-color); padding: 25px 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); }
        h1 { text-align: center; color: var(--text-color); margin-bottom: 25px; font-size: 1.5em; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9em; }
        button { width: 100%; padding: 15px; background-color: var(--primary-color); color: white; border: none; border-radius: 8px; font-size: 1.1em; font-weight: bold; cursor: pointer; }
        button:disabled { background-color: #a0a0a0; cursor: not-allowed; }
        #status-message { text-align: center; margin-top: 15px; color: #666; display: none; }
        .success { color: #28a745; }
        .error { color: #dc3545; white-space: pre-wrap; word-break: break-all; }
        #cardPreview { display: none; border: 1px solid var(--border-color); border-radius: 8px; padding: 16px 18px; margin-bottom: 20px; }
        #cardPreview .pv-title { color: var(--primary-color); font-weight: bold; font-size: 0.9em; }
        #cardPreview .pv-name-row { margin: 6px 0 14px; }
        #cardPreview .pv-name { font-size: 1.3em; font-weight: bold; color: var(--primary-color); }
        #cardPreview .pv-englishName { margin-left: 8px; color: #555; }
        #cardPreview .pv-row { margin-bottom: 8px; font-size: 0.95em; }
        #cardPreview .pv-label { color: #999; display: inline-block; width: 4.5em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>MaKarma 個人名片</h1>
        <div id="cardPreview">
            <div class="pv-title" id="pv-title"></div>
            <div class="pv-name-row"><span class="pv-name" id="pv-name"></span><span class="pv-englishName" id="pv-englishName"></span></div>
            <div class="pv-row"><span class="pv-label">手機</span><span id="pv-mobile"></span></div>
            <div class="pv-row"><span class="pv-label">LINE</span><span id="pv-lineId"></span></div>
            <div class="pv-row"><span class="pv-label">Email</span><span id="pv-email"></span></div>
        </div>
        <button id="share-button" class="share-button" disabled>載入中...</button>
        <p id="status-message"></p>
    </div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
        // ===================================================================
        // == 請務必修改此區塊的設定 ==
        // ===================================================================
        const LIFF_ID = "2007968447-L1XqQgMW";

        // 【圖片網址】請確保這些圖片是公開存取的網址
        const LOGO_URL = "https://raw.githubusercontent.com/Hsulala/u/main/LOGO.png";
        const PHONE_ICON_URL = "https://raw.githubusercontent.com/Hsulala/u/main/phone.png";
        const EMAIL_ICON_URL = "https://raw.githubusercontent.com/Hsulala/u/main/mail.png"; // 修正網址（移除重複的 h）
        const LINE_ICON_URL = "https://raw.githubusercontent.com/Hsulala/u/main/lineid.png";

        // 【固定公司資訊】所有人共用，不用每次填
        const COMPANY_NAME = "瑪卡鎷網路行銷";
        const COMPANY_PHONE = "04-2241-5510";
        const COMPANY_TAX_ID = "96756074";
        const COMPANY_ADDRESS = "台中市西屯區大恩街13號3樓";

        // 【連結網址】
        const WEBSITE_URL = "https://www.makarma.com.tw/";
        const PERFORMANCE_URL = "https://sites.google.com/view/makamaseo/%E9%A6%96%E9%A0%81";
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyxho67YFK74dy5Y76txc3AQ_5JEVLcny7I6-aRNvfLREB9A3ymaS4GSYwm4evPERYxiw/exec";
        // ===================================================================

        const shareButton = document.getElementById('share-button');
        const statusMessage = document.getElementById('status-message');
        const cardPreview = document.getElementById('cardPreview');
        let cardData = null; // 目前這張名片的資料（自己的名片來自後端查詢，轉發的名片來自網址參數，兩者都是唯讀）

        async function main() {
            try {
                await liff.init({ liffId: LIFF_ID });
                console.log('LIFF 初始化成功');

                if (!liff.isInClient()) {
                    showMessage("請在 LINE App 內開啟此頁面", 'error');
                    return;
                }

                const forwarded = loadFromShareLink();
                if (forwarded) {
                    cardData = forwarded;
                    showAsReady();
                    return;
                }

                shareButton.innerText = '查詢名片資料中...';
                const idToken = liff.getIDToken();
                const res = await callBackend({ action: 'getMyCard', idToken });
                if (res.status === 'success') {
                    cardData = res.card;
                    showAsReady();
                } else {
                    showMessage(res.message || '無法取得名片資料', 'error');
                }

            } catch (error) {
                console.error('LIFF 初始化錯誤:', error);
                showMessage(`LIFF 初始化失敗：${error.message}`, 'error');
            }
        }

        function showAsReady() {
            renderPreview(cardData);
            shareButton.innerText = '分享名片';
            shareButton.disabled = false;
            shareButton.addEventListener('click', handleShareClick);
        }

        function renderPreview(data) {
            document.getElementById('pv-title').textContent = data.title;
            document.getElementById('pv-name').textContent = data.name;
            document.getElementById('pv-englishName').textContent = data.englishName;
            document.getElementById('pv-mobile').textContent = data.mobile;
            document.getElementById('pv-lineId').textContent = data.lineId;
            document.getElementById('pv-email').textContent = data.email;
            cardPreview.style.display = 'block';
        }

        async function callBackend(payload) {
            const res = await fetch(GAS_WEB_APP_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload),
            });
            return res.json();
        }

        function showMessage(message, type = 'info') {
            statusMessage.innerText = message;
            statusMessage.className = type;
            statusMessage.style.display = 'block';
            
            // 3秒後自動隱藏訊息（除非是錯誤訊息）
            if (type !== 'error') {
                setTimeout(() => {
                    statusMessage.style.display = 'none';
                }, 3000);
            }
        }

        function loadFromShareLink() {
            const params = new URLSearchParams(window.location.search);
            if (!params.get('name')) return null;

            return {
                name: params.get('name') || '',
                englishName: params.get('englishName') || '',
                title: params.get('title') || '',
                mobile: params.get('mobile') || '',
                email: params.get('email') || '',
                lineId: params.get('lineId') || '',
            };
        }

        function buildShareUrl(data) {
            const params = new URLSearchParams({
                name: data.name,
                englishName: data.englishName,
                title: data.title,
                mobile: data.mobile,
                email: data.email,
                lineId: data.lineId,
            });
            return `https://liff.line.me/${LIFF_ID}?${params.toString()}`;
        }

        async function handleShareClick(event) {
            event.preventDefault(); // 防止任何預設行為

            shareButton.disabled = true;
            shareButton.innerText = '處理中...';

            try {
                showMessage('正在分享名片...', 'info');

                const flexMessage = createFlexMessage(cardData);
                console.log('準備分享 Flex Message:', flexMessage);

                await liff.shareTargetPicker([flexMessage]);
                
                showMessage('名片分享成功！', 'success');
                console.log('分享成功');
                
                // 選項：分享成功後自動關閉視窗（延遲1秒讓使用者看到成功訊息）
                setTimeout(() => {
                    liff.closeWindow();
                }, 1000);
                
            } catch (error) {
                console.error('分享失敗:', error);
                
                if (error.code === 'USER_CANCEL') {
                    showMessage('使用者取消分享', 'info');
                } else {
                    showMessage(`分享失敗：${error.message}`, 'error');
                }
            } finally {
                shareButton.disabled = false;
                shareButton.innerText = '分享名片';
            }
        }

        function createFlexMessage(data) {
            return {
                "type": "flex",
                "altText": `${data.name} 的個人名片 - MaKarma`,
                "contents": {
                    "type": "bubble",
                    "size": "mega",
                    "body": {
                        "type": "box",
                        "layout": "vertical",
                        "paddingAll": "20px",
                        "contents": [
                            {
                                "type": "box",
                                "layout": "horizontal",
                                "contents": [
                                    {
                                        "type": "box",
                                        "layout": "vertical",
                                        "flex": 9,
                                        "contents": [
                                            {
                                                "type": "text",
                                                "text": data.title,
                                                "size": "sm",
                                                "color": "#F39800",
                                                "weight": "bold"
                                            },
                                            {
                                                "type": "box",
                                                "layout": "baseline",
                                                "margin": "sm",
                                                "spacing": "sm",
                                                "contents": [
                                                    {
                                                        "type": "text",
                                                        "text": data.name,
                                                        "size": "xl",
                                                        "weight": "bold",
                                                        "color": "#F39800",
                                                        "flex": 0
                                                    },
                                                    {
                                                        "type": "text",
                                                        "text": data.englishName,
                                                        "size": "md",
                                                        "color": "#333333",
                                                        "flex": 0
                                                    }
                                                ]
                                            },
                                            {
                                                "type": "image",
                                                "url": LOGO_URL,
                                                "size": "70px",
                                                "aspectRatio": "1:1",
                                                "aspectMode": "fit",
                                                "align": "start",
                                                "margin": "md"
                                            }
                                        ]
                                    },
                                    {
                                        "type": "box",
                                        "layout": "vertical",
                                        "flex": 1,
                                        "contents": "MaKarma".split("").map((letter) => ({
                                            "type": "text",
                                            "text": letter,
                                            "size": "sm",
                                            "weight": "bold",
                                            "color": "#F39800",
                                            "align": "center"
                                        }))
                                    }
                                ]
                            },
                            {
                                "type": "separator",
                                "margin": "lg"
                            },
                            {
                                "type": "box",
                                "layout": "vertical",
                                "margin": "lg",
                                "spacing": "sm",
                                "contents": [
                                    {
                                        "type": "box",
                                        "layout": "horizontal",
                                        "alignItems": "center",
                                        "contents": [
                                            {
                                                "type": "image",
                                                "url": PHONE_ICON_URL,
                                                "size": "xxs",
                                                "flex": 0
                                            },
                                            {
                                                "type": "text",
                                                "text": data.mobile,
                                                "margin": "md",
                                                "size": "sm",
                                                "weight": "bold"
                                            }
                                        ],
                                        "action": {
                                            "type": "uri",
                                            "uri": "tel:" + data.mobile
                                        }
                                    },
                                    {
                                        "type": "box",
                                        "layout": "horizontal",
                                        "alignItems": "center",
                                        "contents": [
                                            {
                                                "type": "image",
                                                "url": LINE_ICON_URL,
                                                "size": "xxs",
                                                "flex": 0
                                            },
                                            {
                                                "type": "text",
                                                "text": data.lineId,
                                                "margin": "md",
                                                "size": "sm",
                                                "weight": "bold"
                                            }
                                        ]
                                    },
                                    {
                                        "type": "box",
                                        "layout": "horizontal",
                                        "alignItems": "center",
                                        "contents": [
                                            {
                                                "type": "image",
                                                "url": EMAIL_ICON_URL,
                                                "size": "xxs",
                                                "flex": 0
                                            },
                                            {
                                                "type": "text",
                                                "text": data.email,
                                                "margin": "md",
                                                "size": "sm",
                                                "weight": "bold"
                                            }
                                        ],
                                        "action": {
                                            "type": "uri",
                                            "uri": "mailto:" + data.email
                                        }
                                    }
                                ]
                            },
                            {
                                "type": "separator",
                                "margin": "lg"
                            },
                            {
                                "type": "box",
                                "layout": "vertical",
                                "margin": "lg",
                                "spacing": "xs",
                                "contents": [
                                    {
                                        "type": "text",
                                        "text": COMPANY_NAME,
                                        "size": "md",
                                        "weight": "bold",
                                        "color": "#333333"
                                    },
                                    {
                                        "type": "text",
                                        "text": `${COMPANY_PHONE}　統編 ${COMPANY_TAX_ID}`,
                                        "size": "xs",
                                        "color": "#888888"
                                    },
                                    {
                                        "type": "text",
                                        "text": COMPANY_ADDRESS,
                                        "size": "xs",
                                        "color": "#888888",
                                        "wrap": true
                                    }
                                ]
                            }
                        ]
                    },
                    "footer": {
                        "type": "box",
                        "layout": "vertical",
                        "spacing": "sm",
                        "contents": [
                            {
                                "type": "button",
                                "style": "primary",
                                "height": "sm",
                                "color": "#FFA000",
                                "action": {
                                    "type": "uri",
                                    "label": "轉發這張名片",
                                    "uri": buildShareUrl(data)
                                }
                            },
                            {
                                "type": "separator"
                            },
                            {
                                "type": "button",
                                "style": "primary",
                                "height": "sm",
                                "color": "#FFA000",
                                "action": {
                                    "type": "uri",
                                    "label": "官方網站",
                                    "uri": WEBSITE_URL
                                }
                            },
                            {
                                "type": "separator"
                            },
                            {
                                "type": "button",
                                "style": "primary",
                                "height": "sm",
                                "color": "#FFA000",
                                "action": {
                                    "type": "uri",
                                    "label": "成效展示頁",
                                    "uri": PERFORMANCE_URL
                                }
                            }
                        ]
                    }
                }
            };
        }

        // 在頁面載入時執行
        document.addEventListener('DOMContentLoaded', function() {
            main();
        });
        
        // 為了保險起見，也在 window.onload 時執行
        window.onload = function() {
            if (shareButton.disabled && shareButton.innerText === '載入中...') {
                main();
            }
        };
    </script>
</body>
</html>
